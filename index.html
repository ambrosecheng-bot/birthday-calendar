const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = 'bday-pw';

async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter}, base, 512));
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, b64(P.mac), signed)) throw new Error('bad');
  const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, aesKey, ct);
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }

const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  go.disabled = true; go.textContent = '解鎖中… Unlocking…'; err.textContent = '';
  try {
    const html = await unlock(pw);
    try { document.getElementById('rem').checked ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(_){}
    show(html);
  } catch(_) {
    err.textContent = '密碼不正確 Wrong password';
    go.disabled = false; go.textContent = '進入 Enter';
  }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(_){}
  if (saved) { try { show(await unlock(saved)); } catch(_) { try { localStorage.removeItem(KEY); } catch(__){} } }
})();
